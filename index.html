<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Riya’s Kitchen | Cakes</title>
    
    <!-- SEO & Social Meta Tags -->
    <meta name="description" content="Riya’s Kitchen | Cakes — Freshly baked homemade cakes. Express 1-2 hour delivery for classic cakes, 4-hour delivery for premium cakes & next-day pre-orders." />
    <meta name="theme-color" content="#FAF5ED" />
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Riya’s Kitchen | Cakes" />
    <meta property="og:description" content="Freshly baked homemade cakes made with love. Express & Premium deliveries." />
    <meta property="og:image" content="/riya-kitchen-thali.jpg" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/riya-kitchen-logo.png" />
    <link rel="apple-touch-icon" href="/riya-kitchen-logo.png" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <main class="app-container">
      
      <!-- Top Action Bar -->
      <nav class="top-nav" aria-label="Quick Actions">
        <button id="share-btn" class="icon-btn" aria-label="Share this link page" title="Share page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
        </button>
      </nav>

      <!-- Food Banner Card -->
      <div class="banner-wrapper">
        <img 
          src="/riya-kitchen-thali.jpg" 
          alt="Authentic Homemade Food by Riya’s Kitchen" 
          class="banner-food-img" 
          loading="eager"
        />
        <div class="banner-overlay" aria-hidden="true"></div>
      </div>

      <!-- Brand Profile Header -->
      <header class="profile-section">
        <div class="logo-wrapper">
          <div class="logo-halo" aria-hidden="true"></div>
          <div class="logo-container">
            <img 
              src="/riya-kitchen-logo.png" 
              alt="Riya’s Kitchen Logo" 
              class="profile-logo"
              width="136" 
              height="136" 
              loading="eager"
            />
          </div>
          <div class="verified-badge" title="Verified Homemade Food" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
        </div>

        <h1 class="brand-title">Riya’s Kitchen | Cakes</h1>

        <!-- Tagline & Supporting line -->
        <p class="brand-tagline">Freshly baked homemade cakes, made with love.</p>
        <p class="brand-supporting">Express 1–2 hr delivery • Premium cakes in 4 hrs or next day.</p>
      </header>

      <!-- Ordered Action Buttons -->
      <section class="links-list" id="links-list" aria-label="Official Links">
        <!-- Rendered dynamically from src/data/links.json with fallback -->
      </section>

      <!-- Footer Section -->
      <footer class="footer">
        <span class="footer-brand">Riya’s Kitchen</span>
        <p class="footer-copy">
          Made with <span class="footer-heart">❤️</span> for food lovers
        </p>
      </footer>
    </main>

    <!-- Interactive Copy Link Toast -->
    <div id="toast" class="toast" role="status" aria-live="polite">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"></path>
      </svg>
      <span class="toast-msg">Link copied to clipboard!</span>
    </div>

    <!-- Application Script -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
